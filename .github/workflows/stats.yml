name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch stats svgs
        run: |
          mkdir -p generated
          curl -fSL "https://github-readme-stats.vercel.app/api?username=kiritocroft&show_icons=true&theme=tokyonight&hide_border=true" -o generated/stats.svg || echo "Failed to fetch stats"
          curl -fSL "https://github-readme-stats.vercel.app/api/top-langs/?username=kiritocroft&layout=compact&theme=tokyonight&hide_border=true" -o generated/top-langs.svg || echo "Failed to fetch top langs"
      - name: Commit & Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add generated/stats.svg generated/top-langs.svg || true
          git commit -m "ci: update stats" || true
          git push || true