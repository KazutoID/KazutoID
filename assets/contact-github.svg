<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="70" viewBox="0 0 400 70">
  <defs>
    <linearGradient id="bg-badge" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b0d0f"/>
      <stop offset="100%" stop-color="#0f1317"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="70" rx="4" fill="url(#bg-badge)" stroke="#1f2933" stroke-width="1"/>
  
  <!-- Side accent -->
  <rect width="4" height="70" fill="#ffffff" opacity="0.8"> <!-- GitHub White accent -->
     <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Terminal Text -->
  <text x="20" y="25" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="12" fill="#6c7c93">
    KazutoID@github:~$
  </text>

  <text x="20" y="50" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="18" fill="#00ff9f" font-weight="bold" filter="url(#glow)">
    ./git_checkout<tspan fill="#00eaff">.sh</tspan>
  </text>

  <!-- Blinking Cursor -->
  <rect x="195" y="35" width="10" height="18" fill="#00ff9f">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
