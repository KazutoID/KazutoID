name: 🐍 Generate Matrix Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # Runs at 00:00 UTC every day
  workflow_dispatch:     # Allows manual trigger

jobs:
  build:
    name: 🔄 Matrix Snake Generation
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🐍 Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        id: snake-gif
        with:
          github_user_name: kiritocroft
          # Enhanced snake with custom colors and effects
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=00FF00&color_dots=#0D1117,#00FF00,#00FF00,#00FF00,#00FF00
          
      - name: 🚀 Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🤖 Matrix Snake Animation Updated"
        env:
          GITHUB_TOKEN: ${{ secrets.SNAKE_TOKEN }}