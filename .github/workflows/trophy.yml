name: GitHub Trophy

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight
  workflow_dispatch:

jobs:
  update-trophy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v2
      - uses: ryo-ma/github-profile-trophy@v1
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEME: tokyonight
          NO_FRAME: true
          NO_BG: true
          MARGIN_W: 4
          OUTPUT_PATH: generated/trophy.svg

      - name: Commit & Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "ci: update trophy" || exit 0
          git push