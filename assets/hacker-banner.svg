<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b0d0f"/>
      <stop offset="100%" stop-color="#0f1317"/>
    </linearGradient>
    <mask id="reveal">
      <rect x="0" y="0" width="0" height="180" fill="#fff">
        <animate attributeName="width" values="0;880;880;0" dur="10s" repeatCount="indefinite"/>
      </rect>
    </mask>
  </defs>

  <rect width="960" height="180" fill="url(#bg)"/>

  <!-- subtle scanline -->
  <rect y="-2" width="960" height="2" fill="#00ff9f" opacity="0.07">
    <animate attributeName="y" from="-2" to="182" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- glitch layers -->
  <text x="60" y="96" font-family="Consolas, Monaco, Menlo, monospace" font-size="28" fill="#00eaff" opacity="0.18">
    KazutoID@github:~$ echo "Welcome to my profile!"
    <animate attributeName="x" values="58;62;59;61;60" dur="0.6s" repeatCount="indefinite"/>
  </text>
  <text x="60" y="96" font-family="Consolas, Monaco, Menlo, monospace" font-size="28" fill="#ff00ff" opacity="0.12">
    KazutoID@github:~$ echo "Welcome to my profile!"
    <animate attributeName="x" values="62;58;61;59;60" dur="0.6s" repeatCount="indefinite"/>
  </text>

  <!-- main typed text with reveal mask -->
  <g mask="url(#reveal)">
    <text x="60" y="96" font-family="Consolas, Monaco, Menlo, monospace" font-size="28" fill="#00ff9f">
      KazutoID@github:~$ echo "Welcome to my profile!"
    </text>
    <text x="60" y="132" font-family="Consolas, Monaco, Menlo, monospace" font-size="18" fill="#c0c8ff" opacity="0.8">
      Full-Stack Developer • Next.js • Node.js • TypeScript
    </text>
  </g>

  <!-- blinking/typing cursor -->
  <rect x="60" y="72" width="12" height="28" fill="#00ff9f">
    <animate attributeName="x" values="60;892;892;60" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
