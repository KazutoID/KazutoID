name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch stats svgs
        run: |
          mkdir -p generated
          # Try fetching live svgs; if it fails, write a small placeholder so README never breaks
          if ! curl -fsSL "https://github-readme-stats.vercel.app/api?username=kiritocroft&show_icons=true&theme=tokyonight&hide_border=true" -o generated/stats.svg; then
            cat > generated/stats.svg <<'SVG'
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120"><rect width="100%" height="100%" fill="#1a1b27"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#c0c8ff" font-family="Verdana" font-size="16">Stats unavailable — retry later</text></svg>
SVG
          fi
          if ! curl -fsSL "https://github-readme-stats.vercel.app/api/top-langs/?username=kiritocroft&layout=compact&theme=tokyonight&hide_border=true" -o generated/top-langs.svg; then
            cat > generated/top-langs.svg <<'SVG'
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120"><rect width="100%" height="100%" fill="#1a1b27"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#c0c8ff" font-family="Verdana" font-size="16">Top languages unavailable — retry later</text></svg>
SVG
          fi
      - name: Commit & Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add generated/stats.svg generated/top-langs.svg || true
          git commit -m "ci: update stats" || true
          git push || true