<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="100" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="bg-badge" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b0d0f"/>
      <stop offset="100%" stop-color="#0f1317"/>
    </linearGradient>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="100" rx="4" fill="url(#bg-badge)" stroke="#1f2933" stroke-width="1"/>
  
  <!-- Side accent (Sakura Pink) -->
  <rect width="4" height="100" fill="#ff7eb6" opacity="0.8">
     <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Scanline effect (subtle) -->
  <rect y="0" width="400" height="2" fill="#ff7eb6" opacity="0.05">
    <animate attributeName="y" from="0" to="100" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Terminal Text -->
  <text x="20" y="35" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="14" fill="#6c7c93">
    kiritocroft@github:~/projects$
  </text>

  <text x="20" y="65" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="20" fill="#ff7eb6" font-weight="bold" filter="url(#glow-pink)">
    ./open_mykisah<tspan fill="#ffb7c5">.sh</tspan>
  </text>

  <!-- Blinking Cursor -->
  <rect x="210" y="48" width="10" height="20" fill="#ff7eb6">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Hover hint -->
  <text x="380" y="85" font-family="Arial, sans-serif" font-size="10" fill="#30363d" text-anchor="end">
    [CLICK TO EXECUTE]
  </text>
</svg>
