name: Generate Portofolio Pin Card

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch pin card svg
        run: |
          mkdir -p generated
          curl -fSL "https://github-readme-stats.vercel.app/api/pin/?username=kiritocroft&repo=Portofolio&theme=tokyonight&hide_border=true" -o generated/pin-portofolio.svg || echo "Failed to fetch pin card"
      - name: Commit & Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add generated/pin-portofolio.svg || true
          git commit -m "ci: update Portofolio pin" || true
          git push || true