name: Generate GitHub Streak Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch streak svg
        run: |
          mkdir -p generated
          curl -fSL "https://streak-stats.demolab.com?user=kiritocroft&theme=tokyonight&hide_border=true" -o generated/streak.svg || echo "Failed to fetch streak"
      - name: Commit & Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add generated/streak.svg || true
          git commit -m "ci: update streak" || true
          git push || true