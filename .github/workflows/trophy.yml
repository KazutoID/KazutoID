name: Generate GitHub Trophy

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch trophy svg
        run: |
          mkdir -p generated
          if ! curl -fsSL "https://github-profile-trophy.vercel.app/?username=kiritocroft&theme=tokyonight&no-frame=true&no-bg=true&margin-w=4" -o generated/trophy.svg; then
            cat > generated/trophy.svg <<'SVG'
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120"><rect width="100%" height="100%" fill="#1a1b27"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#c0c8ff" font-family="Verdana" font-size="16">Trophies unavailable — retry later</text></svg>
SVG
          fi
      - name: Commit & Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add generated/trophy.svg || true
          git commit -m "ci: update trophy" || true
          git push || true